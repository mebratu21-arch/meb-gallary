name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meb_gallery_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meb_gallery_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-that-is-at-least-32-chars-long!!!
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Prisma migrations (test DB)
        run: pnpm prisma migrate deploy
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meb_gallery_test

      - name: Test
        run: pnpm test

      - name: Build (packages/shared)
        run: pnpm --filter @meb-gallery/shared build

      - name: Build (api)
        run: pnpm --filter @meb-gallery/api build

      - name: Build (web)
        run: pnpm --filter @meb-gallery/web build
